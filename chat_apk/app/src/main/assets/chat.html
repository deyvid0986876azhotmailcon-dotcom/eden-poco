<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover es lo que deja a env(safe-area-inset-*) recibir los márgenes del sistema -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Poco AI</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f17; /* el mismo valor que BACKGROUND en MainActivity.java */
            --surface: #141b27;
            --surface-2: #1c2636;
            --line: rgba(255, 255, 255, 0.08);
            --text: #eef2f8;
            --text-2: #a7b1c4;
            --text-3: #7f8a9e;
            --accent: #7c9cff;
            /* colores de estado: solo para los medidores y los puntos de estado */
            --ok: #34d399;
            --warn: #fbbf24;
            --crit: #f87171;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 system-ui, -apple-system, "Roboto", sans-serif;
        }

        button, textarea {
            font: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
        }

        .app {
            height: 100%;
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            /* MainActivity ya deja la página fuera de las barras del sistema y del teclado y consume
               esos márgenes, así que dentro de la app esto vale 0. Cubre el caso de abrir la página
               sin ese contenedor. Nunca se suman los dos */
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                     env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        }

        .dot {
            flex: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-3);
        }

        .dot[data-tone="ok"] { background: var(--ok); }
        .dot[data-tone="warn"] { background: var(--warn); }
        .dot[data-tone="crit"] { background: var(--crit); }
        .dot[data-live="true"] { animation: pulse 1.6s ease-in-out infinite; }

        @keyframes pulse {
            50% { opacity: 0.35; transform: scale(0.8); }
        }

        /* Cabecera */
        .topbar {
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            user-select: none;
            -webkit-user-select: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-mark {
            flex: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #8aa5ff, #6a56e0);
            color: #fff;
        }

        .brand-text {
            min-width: 0;
        }

        .brand h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        .status {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-2);
        }

        .status span {
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        /* Con cuatro modelos la fila no cabe en pantallas estrechas: se encoge y se desliza */
        .models {
            flex: 0 1 auto;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: none;
            display: flex;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface);
        }

        .models::-webkit-scrollbar {
            display: none;
        }

        .model {
            flex: none;
            height: 34px;
            padding: 0 11px;
            border: 0;
            border-radius: 11px;
            background: none;
            color: var(--text-2);
            font-size: 12.5px;
            font-weight: 600;
            white-space: nowrap;
        }

        .model[aria-checked="true"] {
            background: var(--surface-2);
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(124, 156, 255, 0.5);
        }

        .model:disabled {
            opacity: 0.5;
        }

        /* Conversación */
        .stage {
            flex: 1 1 0;
            min-height: 0; /* sin esto la lista crece con su contenido en vez de desplazarse */
            position: relative;
            display: flex;
        }

        .messages {
            flex: 1 1 0;
            min-width: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 8px 14px 16px;
        }

        .welcome {
            margin: auto 0;
            padding: 24px 8px;
            text-align: center;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .welcome p {
            margin: 0 auto;
            max-width: 34em;
            color: var(--text-2);
            font-size: 14px;
        }

        .welcome .welcome-hint {
            margin-top: 12px;
            color: var(--text-3);
            font-size: 12.5px;
        }

        .msg {
            flex: none;
            display: flex;
            flex-direction: column;
            animation: rise 0.22s ease-out;
        }

        .msg.user {
            align-items: flex-end;
        }

        .msg.ai {
            align-items: flex-start;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
        }

        .bubble {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 18px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .msg.user .bubble {
            background: linear-gradient(135deg, #4f6fe6, #6a56e0);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .msg.ai .bubble {
            background: var(--surface);
            border: 1px solid var(--line);
            border-bottom-left-radius: 6px;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 15px;
            margin-left: 2px;
            vertical-align: -2px;
            border-radius: 2px;
            background: var(--accent);
            animation: blink 0.9s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        .note {
            margin-top: 6px;
            font-size: 12.5px;
            color: var(--text-3);
        }

        .note.error {
            padding: 8px 11px;
            border: 1px solid rgba(248, 113, 113, 0.4);
            border-radius: 12px;
            background: rgba(248, 113, 113, 0.1);
            color: #fecaca;
        }

        .jump {
            position: absolute;
            right: 14px;
            bottom: 10px;
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--surface-2);
            color: var(--text-2);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }

        /* Tarjeta de telemetría, debajo de cada respuesta */
        .tele {
            width: 100%;
            max-width: 460px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
        }

        .tele-head {
            width: 100%;
            min-height: 42px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 0;
            background: none;
            text-align: left;
            user-select: none;
            -webkit-user-select: none;
        }

        .tele-state {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
        }

        .tele-brief {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
        }

        .tele-brief b {
            color: var(--text);
        }

        .chev {
            flex: none;
            color: var(--text-3);
            transition: transform 0.2s;
        }

        .tele[data-open="true"] .chev { transform: rotate(180deg); }
        .tele[data-open="true"] .b-speed { display: none; } /* abierta, ya está en grande */
        .tele[data-open="false"] .tele-body { display: none; }

        .tele-body {
            display: grid;
            gap: 12px;
            padding: 12px;
            border-top: 1px solid var(--line);
        }

        .tele-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hero {
            flex: 1 1 auto;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.035);
        }

        .hero-tag {
            display: none;
            margin-bottom: 4px;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .hero-value {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .speed {
            font-size: 28px;
            line-height: 1.1;
            font-weight: 750;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
        }

        .unit {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
        }

        .hero-sub {
            margin-top: 2px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 11.5px;
            color: var(--text-3);
            font-variant-numeric: tabular-nums;
        }

        /* Regla de los 60 segundos: la velocidad pasa a ser el dato principal de la tarjeta */
        .tele[data-long="true"] .hero {
            border-color: rgba(124, 156, 255, 0.6);
            background: linear-gradient(135deg, rgba(124, 156, 255, 0.22), rgba(124, 156, 255, 0.06));
            animation: pop 0.5s ease-out;
        }

        .tele[data-long="true"] .hero-tag { display: block; }
        .tele[data-long="true"] .speed { font-size: 38px; }
        .tele[data-long="true"] .unit { font-size: 14px; color: var(--text); }

        .tele[data-long="true"] .b-speed {
            padding: 2px 8px;
            border-radius: 9px;
            background: rgba(124, 156, 255, 0.22);
            box-shadow: inset 0 0 0 1px rgba(124, 156, 255, 0.6);
        }

        @keyframes pop {
            from { transform: scale(0.96); }
            60% { transform: scale(1.03); }
        }

        .rings {
            flex: none;
            display: flex;
            gap: 10px;
        }

        .gauge {
            position: relative;
            width: 64px;
            height: 64px;
        }

        .gauge svg {
            display: block;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* el anillo empieza arriba */
        }

        .g-track, .g-value {
            fill: none;
            stroke-width: 6;
        }

        .g-track {
            stroke: rgba(255, 255, 255, 0.09);
        }

        /* pathLength="100" en el círculo: el trazo se mide en tantos por ciento */
        .g-value {
            stroke: var(--ok);
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            opacity: 0;
            transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease, opacity 0.2s;
        }

        .gauge[data-level] .g-value { opacity: 1; }
        .gauge[data-level="warn"] .g-value { stroke: var(--warn); }
        .gauge[data-level="crit"] .g-value { stroke: var(--crit); }

        .g-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }

        .g-text b {
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        .g-text small {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-3);
        }

        .rows {
            margin: 0;
        }

        .rows > div {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 7px 0;
            border-top: 1px solid var(--line);
            font-size: 12.5px;
        }

        .rows dt {
            flex: none;
            color: var(--text-3);
        }

        .rows dd {
            min-width: 0;
            margin: 0;
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .tele-foot {
            margin: -4px 0 0;
            font-size: 11px;
            color: var(--text-3);
        }

        /* Sugerencias y caja de texto */
        .dock {
            flex: none;
            padding: 6px 14px 10px;
        }

        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0 10px;
            scrollbar-width: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip {
            flex: none;
            height: 36px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            color: var(--text-2);
            font-size: 13px;
            white-space: nowrap;
        }

        .chip:active {
            background: var(--surface-2);
            color: var(--text);
        }

        .composer {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 5px 5px 5px 16px;
            border: 1px solid var(--line);
            border-radius: 27px;
            background: var(--surface);
            transition: border-color 0.2s;
        }

        .composer:focus-within {
            border-color: rgba(124, 156, 255, 0.65);
        }

        .composer textarea {
            flex: 1;
            min-width: 0;
            max-height: 132px;
            padding: 11px 0;
            border: 0;
            outline: 0;
            resize: none;
            background: none;
            font-size: 16px;
            line-height: 1.4;
        }

        .composer textarea::placeholder {
            color: var(--text-3);
        }

        .round {
            flex: none;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: transform 0.15s, background 0.2s;
        }

        .round:active {
            transform: scale(0.94);
        }

        .send {
            background: var(--accent);
            color: #0b1020;
        }

        .send:disabled {
            background: var(--surface-2);
            color: var(--text-3);
        }

        .stop {
            border: 1px solid rgba(248, 113, 113, 0.5);
            background: rgba(248, 113, 113, 0.16);
            color: var(--crit);
        }

        .stop:disabled {
            opacity: 0.5;
        }

        @media (max-width: 350px) {
            .gauge { width: 54px; height: 54px; }
            .model { padding: 0 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.3 6.7L21 11l-6.7 2.3L12 20l-2.3-6.7L3 11l6.7-2.3z"/></svg>
            </div>
            <div class="brand-text">
                <h1>Poco AI</h1>
                <p class="status"><i class="dot" id="statusDot"></i><span id="statusText"></span></p>
            </div>
        </div>
        <div class="models" id="models" role="radiogroup" aria-label="Modelo"></div>
    </header>

    <div class="stage">
        <main class="messages" id="messages" role="log" aria-live="off">
            <section class="welcome" id="welcome">
                <h2>IA local en tu Poco X6 Pro</h2>
                <p>Todo se calcula en el teléfono, sin conexión. El modelo corre en la APU 780 (MDLA 5.3) cuando el acelerador lo admite y el resto va por CPU.</p>
                <p class="welcome-hint" id="modelHint"></p>
            </section>
        </main>
        <button class="jump" id="jump" type="button" aria-label="Ir al final" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
    </div>

    <footer class="dock">
        <div class="chips" id="chips"></div>
        <form class="composer" id="composer">
            <textarea id="prompt" rows="1" maxlength="240" placeholder="Escribe un mensaje…" aria-label="Mensaje" enterkeyhint="send" autocomplete="off"></textarea>
            <button class="round send" id="send" type="submit" aria-label="Enviar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
            <button class="round stop" id="stop" type="button" aria-label="Detener" hidden>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
            </button>
        </form>
    </footer>

    <div class="sr-only" id="announce" aria-live="polite"></div>
</div>

<script>
(() => {
    'use strict';

    const CHAT_CHIPS = [
        ['¿Quién eres?', '¿Quién eres y qué puedes hacer?'],
        ['¿Cómo funciona una NPU?', 'Explícame de forma simple cómo funciona una NPU en un celular.'],
        ['Historia de ciencia ficción', 'Escribe una pequeña historia de ciencia ficción.'],
        ['Consejos de batería', 'Dame 3 consejos para optimizar la batería en Android.'],
    ];
    const MODELS = [
        {
            id: 'qwen15',
            label: 'Qwen 1.5B',
            hint: 'APU Dimensity 8300 (20-30 tok/s), ultra rápido, español nativo',
            chips: CHAT_CHIPS,
        },
        {
            id: 'llama32_3b',
            label: 'Llama 3B',
            hint: 'APU Dimensity 8300 (15-25 tok/s), razonamiento avanzado en español',
            chips: CHAT_CHIPS,
        },
        {
            id: 'llama2_7b',
            label: 'Llama 2 7B',
            hint: 'respuestas completas, lento',
            chips: [
                ['¿Quién eres?', '¿Quién eres y qué hardware estás usando?'],
                ['¿Cómo funciona una NPU?', 'Explícame de forma simple cómo funciona una NPU en un celular.'],
                ['Historia de ciencia ficción', 'Escribe una pequeña historia de ciencia ficción.'],
                ['Consejos de batería', 'Dame 3 consejos para optimizar la batería en Android.'],
            ],
        },
        {
            id: 'stories15M',
            label: 'Stories 15M',
            hint: 'demo rápida, solo escribe cuentos en inglés',
            chips: [
                ['Once upon a time', 'Once upon a time'],
                ['A brave little robot', 'A brave little robot'],
                ['The sleepy dragon', 'The sleepy dragon'],
            ],
        },
    ];
    const LONG_MS = 60000; // desde aquí la velocidad es el dato principal de la tarjeta
    const LEVEL_NAMES = { ok: 'normal', warn: 'alto', crit: 'crítico' };
    const IDLE_STATUS = 'Listo · sin conexión';

    // Lo que va debajo de cada respuesta. No lleva nada escrito por el usuario
    const CARD = `
        <section class="tele" data-open="true" aria-label="Telemetría de la respuesta">
            <button class="tele-head" type="button" aria-expanded="true">
                <span class="tele-state"><i class="dot"></i><span class="tele-state-text"></span></span>
                <span class="tele-brief"><b class="b-speed"></b><span class="b-time">0:00</span></span>
                <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="tele-body">
                <div class="tele-main">
                    <div class="hero">
                        <div class="hero-tag">Más de 60 s · velocidad media</div>
                        <div class="hero-value"><span class="speed">—</span><span class="unit">tok/s</span></div>
                        <div class="hero-sub"><span class="tokens">0 tokens</span> · <span class="time">0:00</span></div>
                    </div>
                    <div class="rings">
                        <div class="gauge cpu" role="img" aria-label="CPU sin dato">
                            <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="g-track" cx="32" cy="32" r="27"/><circle class="g-value" cx="32" cy="32" r="27" pathLength="100"/></svg>
                            <div class="g-text" aria-hidden="true"><b>—</b><small>CPU</small></div>
                        </div>
                        <div class="gauge ram" role="img" aria-label="RAM sin dato">
                            <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="g-track" cx="32" cy="32" r="27"/><circle class="g-value" cx="32" cy="32" r="27" pathLength="100"/></svg>
                            <div class="g-text" aria-hidden="true"><b>—</b><small>RAM</small></div>
                        </div>
                    </div>
                </div>
                <dl class="rows">
                    <div><dt>APU · MDLA 5.3</dt><dd><i class="dot apu-dot"></i><span class="apu">Preparando…</span></dd></div>
                    <div><dt>GPU · Mali-G615</dt><dd class="gpu">0 % · Reposo</dd></div>
                    <div><dt>Memoria RAM</dt><dd class="ram-text">—</dd></div>
                    <div><dt>Primer token</dt><dd class="ttft">—</dd></div>
                </dl>
                <p class="tele-foot">CPU: proceso del motor; 100 % es un núcleo completo.</p>
            </div>
        </section>`;

    const $ = id => document.getElementById(id);
    const el = {
        statusDot: $('statusDot'), statusText: $('statusText'), models: $('models'),
        messages: $('messages'), welcome: $('welcome'), hint: $('modelHint'), jump: $('jump'),
        chips: $('chips'), composer: $('composer'), prompt: $('prompt'), send: $('send'), stop: $('stop'),
        announce: $('announce'),
    };
    const backend = window.AndroidBackend; // no existe al abrir la página en un navegador
    const state = {
        model: MODELS[0].id,
        active: null,    // la respuesta que se está generando
        last: null,      // la anterior
        stopping: false,
        stick: true,     // la lista sigue al último mensaje mientras el usuario no suba a leer
    };
    let stopTimer = 0;
    let previewTimer = 0;

    // ---- formato ----
    const num = (value, digits) => value.toFixed(digits).replace('.', ',');
    const speedText = value => value > 0 ? num(value, value < 10 ? 2 : 1) : '—';
    const gb = value => value === undefined || value === null || value === '' ? '—' : String(value).replace('.', ',');
    const clock = ms => {
        const seconds = Math.max(0, Math.floor(ms / 1000));
        return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    };

    // ---- modelo y sugerencias ----
    function selectModel(id) {
        const model = MODELS.find(m => m.id === id) || MODELS[0];
        state.model = model.id;
        try { localStorage.setItem('model', model.id); } catch (e) { /* sin almacenamiento, se pierde al cerrar */ }
        el.models.querySelectorAll('.model').forEach(button => {
            button.setAttribute('aria-checked', String(button.dataset.id === model.id));
        });
        el.hint.textContent = model.label + ': ' + model.hint + '.';
        el.chips.textContent = '';
        model.chips.forEach(([label, text]) => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'chip';
            chip.textContent = label;
            // rellena la caja y deja el envío al usuario: una generación del 7B no es barata
            chip.addEventListener('click', () => { el.prompt.value = text; fitPrompt(); });
            el.chips.appendChild(chip);
        });
    }

    function renderModels() {
        MODELS.forEach(model => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'model';
            button.dataset.id = model.id;
            button.setAttribute('role', 'radio');
            button.title = model.hint;
            button.textContent = model.label;
            button.addEventListener('click', () => selectModel(model.id));
            el.models.appendChild(button);
        });
        let saved = null;
        try { saved = localStorage.getItem('model'); } catch (e) { /* igual que arriba */ }
        selectModel(saved);
    }

    // ---- lista de mensajes ----
    function follow() {
        if (state.stick) { el.messages.scrollTop = el.messages.scrollHeight; }
    }

    function addUser(text) {
        const row = document.createElement('article');
        row.className = 'msg user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        row.appendChild(bubble);
        el.messages.appendChild(row);
    }

    function addAssistant() {
        const row = document.createElement('article');
        row.className = 'msg ai';
        row.innerHTML = '<div class="bubble"><span class="answer"></span><span class="cursor"></span></div>' + CARD;
        el.messages.appendChild(row);
        const q = selector => row.querySelector(selector);
        const m = {
            row, bubble: q('.bubble'), answer: q('.answer'), cursor: q('.cursor'),
            card: q('.tele'), head: q('.tele-head'),
            ui: {
                dot: q('.tele-state .dot'), stateText: q('.tele-state-text'),
                briefSpeed: q('.b-speed'), briefTime: q('.b-time'),
                speed: q('.speed'), tokens: q('.tokens'), time: q('.time'),
                cpu: q('.gauge.cpu'), ram: q('.gauge.ram'),
                apuDot: q('.apu-dot'), apu: q('.apu'), gpu: q('.gpu'), ramText: q('.ram-text'), ttft: q('.ttft'),
            },
            t0: performance.now(), elapsedMs: 0, tokens: 0, speed: 0,
            started: false,  // ya llegó texto
            official: false, // la velocidad la dio el propio motor
            toggled: false,  // el usuario abrió o cerró la tarjeta a mano
        };
        m.head.addEventListener('click', () => { m.toggled = true; setOpen(m, m.card.dataset.open !== 'true'); });
        return m;
    }

    function setOpen(m, open) {
        m.card.dataset.open = String(open);
        m.head.setAttribute('aria-expanded', String(open));
        follow();
    }

    function setPhase(m, text, tone, live) {
        m.ui.stateText.textContent = text;
        m.ui.dot.dataset.tone = tone;
        m.ui.dot.dataset.live = String(live);
        if (live) { setStatus(text, tone, true); }
    }

    function setStatus(text, tone, live) {
        el.statusText.textContent = text;
        el.statusDot.dataset.tone = tone;
        el.statusDot.dataset.live = String(live);
    }

    // ---- telemetría ----
    function setGauge(gauge, value, name) {
        const known = Number.isFinite(value) && value >= 0;
        // verde por debajo de 60, amarillo de 60 a 85, rojo por encima
        const level = !known ? null : value < 60 ? 'ok' : value <= 85 ? 'warn' : 'crit';
        const shown = known ? Math.min(100, value) : 0;
        if (level && shown >= 0.5) { gauge.dataset.level = level; } else { delete gauge.dataset.level; }
        gauge.querySelector('.g-value').style.strokeDashoffset = String(100 - shown);
        gauge.querySelector('b').textContent = known ? Math.round(value) + '%' : '—';
        gauge.setAttribute('aria-label', known ? `${name} ${Math.round(value)} %, ${LEVEL_NAMES[level]}` : `${name} sin dato`);
    }

    function render(m) {
        const time = clock(m.elapsedMs);
        const speed = speedText(m.speed);
        m.ui.time.textContent = time;
        m.ui.briefTime.textContent = time;
        m.ui.speed.textContent = speed;
        m.ui.briefSpeed.textContent = m.speed > 0 ? speed + ' tok/s' : '';
        m.ui.tokens.textContent = m.tokens === 1 ? '1 token' : m.tokens + ' tokens';
        if (m.elapsedMs >= LONG_MS && m.speed > 0) { m.card.dataset.long = 'true'; }
    }

    function applyStats(stats) {
        const m = state.active || state.last;
        if (!m || !stats) { return; }
        const ms = Number(stats.elapsedMs !== undefined ? stats.elapsedMs : stats.elapsedSec * 1000);
        if (ms > 0) {
            m.elapsedMs = ms;
            m.t0 = performance.now() - ms;
        }
        if (stats.tokenCount > 0) { m.tokens = Number(stats.tokenCount); }
        const speed = Number(stats.tokPerSec);
        if (speed > 0 && !m.official) { m.speed = speed; }
        if (stats.ttftMs > 0) { m.ui.ttft.textContent = num(stats.ttftMs / 1000, 1) + ' s'; }
        if ('cpuPercent' in stats) { setGauge(m.ui.cpu, Number(stats.cpuPercent), 'CPU'); }
        if ('ramPercent' in stats) { setGauge(m.ui.ram, Number(stats.ramPercent), 'RAM'); }
        if (stats.ramTotalGb) {
            m.ui.ramText.textContent = `${gb(stats.ramUsedGb)} de ${gb(stats.ramTotalGb)} GB · ${gb(stats.ramFreeGb)} GB libres`;
        }
        if (stats.gpuStatus) { m.ui.gpu.textContent = stats.gpuStatus; }
        if (stats.apuSummary) {
            m.ui.apu.textContent = stats.apuSummary;
            m.ui.apuDot.dataset.tone = stats.apuState === 'active' ? 'ok' : stats.apuState === 'cpu' ? 'warn' : '';
            m.ui.apuDot.dataset.live = String(stats.apuState === 'starting');
        }
        render(m);
        follow();
    }

    // el reloj avanza aunque la telemetría de la app tarde en llegar
    setInterval(() => {
        const m = state.active;
        if (!m) { return; }
        m.elapsedMs = performance.now() - m.t0;
        render(m);
    }, 500);

    // ---- enviar, detener, terminar ----
    function fitPrompt() {
        el.prompt.style.height = 'auto';
        el.prompt.style.height = Math.min(el.prompt.scrollHeight, 132) + 'px';
        el.send.disabled = !el.prompt.value.trim();
    }

    function setBusy(busy) {
        el.send.hidden = busy;
        el.stop.hidden = !busy;
        el.stop.disabled = false;
        el.chips.hidden = busy;
        el.models.querySelectorAll('.model').forEach(button => { button.disabled = busy; });
        if (!busy) { setStatus(IDLE_STATUS, 'ok', false); }
    }

    function send() {
        const text = el.prompt.value.trim();
        if (!text || state.active) { return; }
        el.welcome.hidden = true;
        // solo la respuesta más reciente queda con la tarjeta desplegada
        if (state.last && !state.last.toggled) { setOpen(state.last, false); }
        addUser(text);
        el.prompt.value = '';
        fitPrompt();
        const m = addAssistant();
        state.active = m;
        state.stick = true;
        setBusy(true);
        setPhase(m, 'Preparando modelo…', '', true);
        render(m);
        follow();
        if (backend && backend.sendWithModel) {
            backend.sendWithModel(text, state.model);
        } else if (backend && backend.send) {
            backend.send(text);
        } else {
            preview();
        }
    }

    function stop() {
        const m = state.active;
        if (!m || state.stopping) { return; }
        state.stopping = true;
        el.stop.disabled = true;
        setPhase(m, 'Deteniendo…', '', true);
        if (backend && backend.stop) {
            backend.stop();
            // la app avisa con onStreamDone cuando el motor ha muerto; esto es por si no llegara
            stopTimer = setTimeout(() => finish('stopped'), 5000);
        } else {
            finish('stopped');
        }
    }

    function finish(outcome, detail) {
        const m = state.active;
        if (!m) { return; }
        state.active = null;
        state.last = m;
        state.stopping = false;
        clearTimeout(stopTimer);
        clearInterval(previewTimer);
        m.cursor.remove();
        const text = m.answer.textContent.trimEnd();
        m.answer.textContent = text;
        if (!text) { m.bubble.hidden = true; }
        if (outcome === 'error' || !text) {
            const note = document.createElement('p');
            note.className = outcome === 'error' ? 'note error' : 'note';
            note.textContent = outcome === 'error' ? detail : outcome === 'stopped' ? 'Generación detenida.' : 'El modelo no devolvió texto.';
            m.row.insertBefore(note, m.card);
        }
        if (outcome === 'error' && !m.started) { m.card.hidden = true; } // no llegó a arrancar: no hay nada que medir
        if (outcome === 'done') { setPhase(m, 'Completado', 'ok', false); }
        else if (outcome === 'stopped') { setPhase(m, 'Detenido', '', false); }
        else { setPhase(m, 'Error', 'crit', false); }
        render(m);
        setBusy(false);
        el.announce.textContent = outcome === 'error' ? 'Error: ' + detail : 'Respuesta: ' + text;
        follow();
    }

    // ---- lo que llama MainActivity ----
    window.onStreamChunk = chunk => {
        const m = state.active;
        if (!m) { return; }
        let piece = String(chunk);
        if (!m.started) {
            piece = piece.replace(/^\s+/, ''); // el modelo suele empezar con un espacio
            if (!piece) { return; }
            m.started = true;
            if (!state.stopping) { setPhase(m, 'Generando…', 'ok', true); }
        }
        m.answer.textContent += piece;
        m.tokens++;
        follow();
    };

    window.onTelemetryUpdate = applyStats;

    // la velocidad que mide el propio motor, cuando la da, manda sobre la que estima la app
    window.onFinalSpeedReport = speed => {
        const m = state.active || state.last;
        const value = Number(speed);
        if (!m || !(value > 0)) { return; }
        m.speed = value;
        m.official = true;
        render(m);
    };

    window.onStreamDone = () => finish(state.stopping ? 'stopped' : 'done');

    window.onStreamError = message => finish('error', String(message || 'Error desconocido'));

    // ---- vista previa en un navegador, sin el motor: texto y telemetría de muestra ----
    function preview() {
        const words = 'Vista previa sin el motor. Este texto y los datos de la tarjeta son de muestra para ver el diseño.'.split(' ');
        const offset = location.search.includes('long') ? 58000 : 0; // ?long enseña la regla de los 60 s
        const start = performance.now();
        const firstAt = 1200;
        let sent = 0;
        previewTimer = setInterval(() => {
            const elapsedMs = performance.now() - start + offset;
            const since = elapsedMs - offset - firstAt;
            if (since > 0 && sent < words.length) { window.onStreamChunk((sent ? ' ' : '') + words[sent++]); }
            window.onTelemetryUpdate({
                elapsedMs, tokenCount: sent, ttftMs: sent ? firstAt : -1,
                tokPerSec: sent > 1 ? ((sent - 1) * 1000 / since).toFixed(2) : '0.00',
                cpuPercent: Math.round(45 + 50 * Math.abs(Math.sin(elapsedMs / 1500))),
                ramPercent: 64, ramUsedGb: '7.1', ramTotalGb: '11.1', ramFreeGb: '4.0',
                gpuStatus: '0 % · Reposo',
                apuState: sent ? 'active' : 'starting', apuSummary: sent ? 'Activa · vista previa' : 'Preparando…',
            });
            if (sent >= words.length) { window.onStreamDone(); }
        }, 200);
    }

    // ---- eventos ----
    el.composer.addEventListener('submit', event => { event.preventDefault(); send(); });
    el.prompt.addEventListener('input', fitPrompt);
    el.prompt.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
    });
    el.stop.addEventListener('click', stop);
    el.jump.addEventListener('click', () => { state.stick = true; follow(); });
    el.messages.addEventListener('scroll', () => {
        const fromBottom = el.messages.scrollHeight - el.messages.scrollTop - el.messages.clientHeight;
        state.stick = fromBottom < 80;
        el.jump.hidden = state.stick;
    }, { passive: true });
    window.addEventListener('resize', follow); // al abrirse el teclado la página encoge

    renderModels();
    fitPrompt();
    setStatus(IDLE_STATUS, 'ok', false);
})();
</script>

</body>
</html>
