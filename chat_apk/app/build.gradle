plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.poco.chatapk'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.poco.chatapk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // The same key in every build (Eden's public debug keystore), so a new APK installs over the
    // previous one and the app keeps its data.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}
