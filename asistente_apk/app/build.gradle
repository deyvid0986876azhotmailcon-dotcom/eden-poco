plugins { id 'com.android.application' }

android {
    namespace 'dev.poco.asistente'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.poco.asistente'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '0.31'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // CI applies the private key and rotation lineage with apksigner after assembleDebug.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android supplies org.json in production; JVM tests need its real implementation.
    testImplementation 'org.json:json:20240303'
}
