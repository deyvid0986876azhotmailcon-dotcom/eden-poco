plugins { id 'com.android.application' }

android {
    namespace 'dev.poco.asistente'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.poco.asistente'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Public debug key retained to preserve existing installs during development.
    // Private signing and data migration remain a separate task before stable use.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android supplies org.json in production; JVM tests need its real implementation.
    testImplementation 'org.json:json:20240303'
}
