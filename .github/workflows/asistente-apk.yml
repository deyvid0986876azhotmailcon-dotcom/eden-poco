name: Build Asistente APK
on:
  push:
    branches: [main]
    paths: ['asistente_apk/**', '.github/workflows/asistente-apk.yml']
  pull_request:
    paths: ['asistente_apk/**', '.github/workflows/asistente-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests and APK
        working-directory: asistente_apk
        run: gradle --no-daemon test assembleDebug
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asistente-tests-${{ github.run_number }}
          path: asistente_apk/app/build/reports/tests/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: asistente-debug-${{ github.run_number }}
          path: asistente_apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
