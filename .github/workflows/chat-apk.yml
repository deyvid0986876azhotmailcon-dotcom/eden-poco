name: Build Chat APK

on:
  push:
    branches: [main]
    paths: ["chat_apk/**", ".github/workflows/chat-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build run_nnapi as shared library
        run: |
          mkdir -p chat_apk/app/src/main/jniLibs/arm64-v8a
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang -O3 npu-probe/run_nnapi.c npu-probe/fp16.c -o chat_apk/app/src/main/jniLibs/arm64-v8a/librun_nnapi.so -lm -ldl -llog

      - name: Build APK
        working-directory: chat_apk
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-debug-${{ github.run_number }}
          path: chat_apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
