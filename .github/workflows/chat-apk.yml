name: Build Chat APK

on:
  push:
    branches: [main]
    paths: ["chat_apk/**", "npu-probe/**", ".github/workflows/chat-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75 # it may have to wait for a build of llama.cpp
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build run_nnapi as shared library
        run: |
          mkdir -p chat_apk/app/src/main/jniLibs/arm64-v8a
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang -O3 npu-probe/run_nnapi.c -o chat_apk/app/src/main/jniLibs/arm64-v8a/librun_nnapi.so -lm -ldl -llog

      # The llama.cpp engine is built by llama-android.yml: take it from its latest successful run.
      # It is an executable, but only files named lib*.so are unpacked next to the app.
      - name: Fetch llama.cpp engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A build of the engine that the same push started is still running: wait for it, to
          # package what it makes and not what the one before made.
          LATEST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow llama-android.yml --limit 1 --json databaseId,status -q '.[0] | "\(.databaseId) \(.status)"')
          if [ "${LATEST#* }" != "completed" ]; then
            echo "waiting for llama-android run ${LATEST%% *}"
            gh run watch "${LATEST%% *}" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null || true
          fi
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow llama-android.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          echo "llama-android run: $RUN"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n llama-android -D llama_bin
          # The engine of the app is the Vulkan build when there is one: with -ngl it puts the
          # layers of the model on the GPU. The CPU build goes next to it, for the app to use if
          # the other one dies on the phone.
          LIBS=chat_apk/app/src/main/jniLibs/arm64-v8a
          if [ -f llama_bin/llama-completion-vulkan ]; then
            cp llama_bin/llama-completion-vulkan "$LIBS/libllama_completion.so"
            cp llama_bin/llama-completion "$LIBS/libllama_completion_cpu.so"
            echo "Engine: llama-completion with Vulkan, and the CPU build as libllama_completion_cpu.so" >> "$GITHUB_STEP_SUMMARY"
          else
            cp llama_bin/llama-completion "$LIBS/libllama_completion.so"
            echo "::warning title=No Vulkan engine::packaging the CPU build of llama-completion"
            echo "Engine: llama-completion for the CPU only, the artifact has no Vulkan build" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The server, for the assistant to keep one model loaded. Not every llama.cpp release builds it.
          if [ -f llama_bin/llama-server ]; then
            cp llama_bin/llama-server chat_apk/app/src/main/jniLibs/arm64-v8a/libllama_server.so
          else
            echo "::warning title=No llama-server::the llama-android artifact has no llama-server"
          fi
          ls -la chat_apk/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: chat_apk
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-debug-${{ github.run_number }}
          path: chat_apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
