name: Build llama.cpp for Android

# llama.cpp for the on-device LLM work, built twice: for the CPU and with the Vulkan backend for
# the GPU. Command-line tools, run from adb shell or packaged in the chat app by chat-apk.yml.
# It does not touch the Eden build.
on:
  push:
    branches: [main]
    paths: [".github/workflows/llama-android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the latest llama.cpp release
        run: |
          TAG=$(gh release view --repo ggml-org/llama.cpp --json tagName -q .tagName)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp.git

      - name: Configure
        run: |
          # The Dimensity 8300 cores (Cortex-A715 and A510) have dotprod, i8mm and fp16.
          cmake -S llama.cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm+fp16 \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF

      - name: Build
        run: |
          # Tool names changed between releases (llama-completion is the old llama-cli): build what exists.
          for t in llama-bench llama-quantize llama-cli llama-completion llama-server; do
            cmake --build build -j"$(nproc)" --target "$t" || echo "::warning title=Target failed::$t"
          done

      - name: Collect
        run: |
          mkdir out
          for t in llama-bench llama-quantize llama-cli llama-completion llama-server; do
            [ -f "build/bin/$t" ] && cp "build/bin/$t" out/
          done
          test -f out/llama-bench
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" out/*
          echo "$TAG" > out/VERSION.txt
          ls -la out

      # A second build with the Vulkan backend, for the Mali-G615 (-ngl 99 puts the layers on the
      # GPU). Its tools get a -vulkan suffix and chat-apk.yml packages llama-completion-vulkan when
      # it is there. A failure here does not fail the job: the CPU tools above are uploaded anyway,
      # and the summary of the run says whether the Vulkan ones were built.
      - name: Vulkan tools
        continue-on-error: true
        run: |
          # glslc compiles the shaders, here on the runner. The NDK of this runner has none.
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev
          glslc --version

      - name: Configure with Vulkan
        continue-on-error: true
        run: |
          SYSROOT="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          # The library the tools link to is the one of the phone, from the NDK. llama.cpp includes
          # the C++ headers (vulkan.hpp): if this NDK only has the C ones, all of them come from
          # Khronos, because the two sets have to be of the same version.
          HEADERS=""
          if [ ! -f "$SYSROOT/usr/include/vulkan/vulkan.hpp" ]; then
            git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git
            HEADERS="-DVulkan_INCLUDE_DIR=$PWD/Vulkan-Headers/include"
          fi
          cmake -S llama.cpp -B build-vulkan \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm+fp16 \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DGGML_VULKAN=ON -DVK_USE_PLATFORM_ANDROID_KHR=ON \
            -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslc \
            -DVulkan_LIBRARY="$SYSROOT/usr/lib/aarch64-linux-android/28/libvulkan.so" \
            $HEADERS

      - name: Build with Vulkan
        continue-on-error: true
        run: |
          for t in llama-bench llama-completion llama-server; do
            if cmake --build build-vulkan -j"$(nproc)" --target "$t"; then
              cp "build-vulkan/bin/$t" "out/$t-vulkan"
              "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "out/$t-vulkan"
            else
              echo "::warning title=Vulkan target failed::$t"
            fi
          done
          ls -la out
          if [ -f out/llama-completion-vulkan ] && [ -f out/llama-bench-vulkan ]; then
            echo "Vulkan build: OK (llama-completion-vulkan and llama-bench-vulkan are in the artifact)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No Vulkan engine::the artifact has only the CPU tools"
            echo "Vulkan build: FAILED, the artifact has only the CPU tools" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-android
          path: out/
          if-no-files-found: error
          retention-days: 14
