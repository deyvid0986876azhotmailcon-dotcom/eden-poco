name: Build NPU probe

on:
  push:
    branches: [main]
    paths: ["npu-probe/**", ".github/workflows/npu-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable and APK
        working-directory: npu-probe
        run: |
          set -euo pipefail
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          JAR="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -n 1)/android.jar"
          echo "clang: $CC"
          echo "build-tools: $BT"
          echo "android.jar: $JAR"
          mkdir -p out lib/arm64-v8a

          "$CC" -O2 -Wall -DPROBE_EXE -o out/npu_probe npu_probe.c -llog -ldl -lm
          # what the compiler says goes into the artifact: the build log is not readable without a login
          "$CC" -O3 -Wall -o out/run_nnapi run_nnapi.c -llog -ldl -lm 2> out/run_nnapi.build.txt || true
          # The attention experiment uses the same builder in replay and on the
          # phone. Run its numerical regression on CI, never on the notebook.
          gcc -O2 -Wall -o out/run_nnapi_attention_test_host run_nnapi_attention_test.c -ldl -lm -pthread \
            2> out/attention_host.build.txt
          ./out/run_nnapi_attention_test_host 2>&1 | tee out/attention_host_test.txt
          "$CC" -O2 -Wall -o out/run_nnapi_attention_test run_nnapi_attention_test.c -llog -ldl -lm \
            2> out/attention_android.build.txt
          cp stage_attention.sh out/
          "$CC" -O2 -Wall -o out/gguf2bin gguf2bin.c -lm
          gcc -O2 -Wall -o out/gguf2bin_host gguf2bin.c -lm
          "$CC" -O2 -Wall -o out/npu_block_probe npu_block_probe.c -llog -ldl -lm
          # A probe that has never been compiled must not break the others: what the compiler
          # says goes into the artifact, where it can be read without a GitHub login.
          "$CC" -O2 -Wall -o out/neuron_quant_probe neuron_quant_probe.c -llog -ldl -lm \
            2> out/neuron_quant_probe.build.txt || true
          # The same probe for a PC, where it only compiles the graphs: here it is built to see
          # that it builds. neuron-host-probe.yml is the one that runs it, with MediaTek's SDK.
          gcc -O2 -Wall -o out/neuron_quant_probe_host neuron_quant_probe.c -ldl -lm \
            2> out/neuron_quant_probe_host.build.txt || true
          "$CC" -O2 -Wall -shared -fPIC -o lib/arm64-v8a/libnpuprobe.so npu_probe.c -landroid -llog -ldl -lm

          "$BT/aapt2" link -o unaligned.apk --manifest AndroidManifest.xml -I "$JAR"
          zip -r unaligned.apk lib
          "$BT/zipalign" -f 4 unaligned.apk aligned.apk
          keytool -genkeypair -keystore debug.jks -storepass android -keypass android -alias probe \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=npu-probe"
          "$BT/apksigner" sign --ks debug.jks --ks-pass pass:android --key-pass pass:android \
            --out out/npu-probe.apk aligned.apk

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npu-probe-${{ github.run_number }}
          path: npu-probe/out/*
          if-no-files-found: error
          retention-days: 14
