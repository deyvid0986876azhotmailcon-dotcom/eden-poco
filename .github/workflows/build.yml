name: Build Eden Android

on:
  push:
    branches: [main]
    paths: ["patches/**", "EDEN_COMMIT", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CCACHE: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: poco

      - name: Read pinned Eden commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < poco/EDEN_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ steps.pin.outputs.sha }}
          path: eden
          fetch-depth: 0

      - name: Apply patches
        working-directory: eden
        run: |
          for p in ../poco/patches/*.patch; do
            [ -e "$p" ] || continue
            echo "-- applying $p"
            git apply --verbose --whitespace=nowarn "$p"
          done
          git status --short

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache glslang-tools ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.pin.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.pin.outputs.sha }}-
            ccache-

      - name: Build
        working-directory: eden
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b RelWithDebInfo

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-poco-${{ github.run_number }}
          path: eden/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
