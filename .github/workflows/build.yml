name: Build Eden Android

on:
  push:
    branches: [main]
    paths: ["patches/**", "EDEN_COMMIT", ".github/workflows/build.yml"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # One APK per patch set, to tell which patch causes a given behaviour.
        # "patches" is a space-separated list of globs relative to patches/.
        include:
          - variant: geom
            patches: "0001-*.patch 0003-*.patch"
          - variant: all
            patches: "*.patch"
    env:
      PATCHES: ${{ matrix.patches }}
      CCACHE: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout patches
        uses: actions/checkout@v4
        with:
          path: poco

      - name: Read pinned Eden commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < poco/EDEN_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Checkout Eden
        uses: actions/checkout@v4
        with:
          repository: eden-emulator/mirror
          ref: ${{ steps.pin.outputs.sha }}
          path: eden
          fetch-depth: 0

      - name: Apply patches
        working-directory: eden
        run: |
          # Split the list without expanding the globs against the Eden tree.
          set -f; set -- $PATCHES; set +f
          for pattern in "$@"; do
            for p in ../poco/patches/$pattern; do
              [ -e "$p" ] || continue
              echo "-- applying $p"
              git apply --verbose --whitespace=nowarn "$p"
            done
          done
          git status --short

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache glslang-tools ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.pin.outputs.sha }}-${{ matrix.variant }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.pin.outputs.sha }}-${{ matrix.variant }}-
            ccache-${{ steps.pin.outputs.sha }}-
            ccache-

      - name: Build
        working-directory: eden
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          set -o pipefail
          # Eden copies SDL's Java sources into the tree during the CMake configure, but Gradle
          # does not order the Kotlin compile after it, so the build fails at random. Running the
          # native build first guarantees they exist. Same properties as build.sh, to reuse its output.
          (cd src/android && ./gradlew :app:externalNativeBuildMainlineRelWithDebInfo \
              -Dorg.gradle.workers.max="$(nproc)" \
              -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=${CCACHE}" -Pnightly=false) 2>&1 | tee "$GITHUB_WORKSPACE/build.log" \
            || echo "::warning title=Native prebuild failed::The Kotlin compile may race with the CMake configure in this run"
          .ci/android/build.sh -t standard -b RelWithDebInfo 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      # Job logs need a GitHub login, annotations do not: surface the failure there.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          report() {
            body=$(cut -c1-220 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$body" ] && echo "::error title=$1::$body"
          }
          # "^e: " is how the Kotlin compiler prefixes its errors. Annotations are truncated near 4 KB.
          grep -n -E "^e: |error:|FAILED|What went wrong|CMake Error|Could not |No such file|ninja: build stopped" build.log | grep -v "file or directory" | head -n 18 | report "Matched error lines"
          tail -n 25 build.log | report "Last 25 log lines"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}-${{ matrix.variant }}
          path: build.log
          retention-days: 7

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-poco-${{ github.run_number }}-${{ matrix.variant }}
          path: eden/artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
