name: Build phone tools

# Small command-line helpers that run from adb shell. It does not touch the Eden build.
on:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/phone-tools.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build downloader
        working-directory: tools/bajar
        run: |
          mkdir -p ../../out
          # A static Linux binary runs from adb shell and needs no NDK.
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../out/bajar .
          ls -la ../../out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: phone-tools
          path: out/
          if-no-files-found: error
          retention-days: 14
